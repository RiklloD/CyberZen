syntax = "proto3";

package cyberzen.shared.v1;

option go_package = "github.com/cyberzen/shared/generated/go/contracts;contracts";

import "google/protobuf/timestamp.proto";

// A single package present in an SBOM snapshot.
message Package {
  // Package name as it appears in the ecosystem registry.
  string name = 1;

  // Resolved version string (e.g. "1.2.3").
  string version = 2;

  // Ecosystem identifier — npm, PyPI, Maven, Go, RubyGems, crates.io, etc.
  string ecosystem = 3;

  // Cryptographic hash of the package artifact when available.
  // Format: "<algo>:<hex>" (e.g. "sha256:abcdef...").
  string hash = 4;

  // SPDX license identifiers detected for this package.
  repeated string licenses = 5;

  // Whether this is a direct dependency of the project.
  bool direct = 6;
}

// SBOM snapshot for a single commit of a repository.
message SBOM {
  // Tenant the snapshot belongs to.
  string tenant_id = 1;

  // Repository URL.
  string repo_url = 2;

  // Commit SHA the snapshot was generated against.
  string commit_sha = 3;

  // Packages in the snapshot.
  repeated Package packages = 4;

  // When the snapshot was generated by the scanner.
  google.protobuf.Timestamp generated_at = 5;

  // Tool that produced the snapshot (e.g. "syft@1.0.0").
  string generator = 6;
}
